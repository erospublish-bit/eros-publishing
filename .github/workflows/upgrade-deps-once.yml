name: One-time dependency lock refresh (working branch only)
# Refresh after correcting React hook lint issues.
on:
  push:
    branches: [improve/sitewide-audit-nov-2026]
    paths: ['.github/workflows/upgrade-deps-once.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/sitewide-audit-nov-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade stable Next and ESLint preset together
        run: npm install --save-exact next@16.4.5 eslint-config-next@16.4.5
      - name: Verify install and source
        run: npm run lint && npm run typecheck && npm run build
      - name: Save updated manifest and lockfile to working branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Align Next.js and ESLint preset at 16.4.5"
            git push origin HEAD:improve/sitewide-audit-nov-2026
          fi
